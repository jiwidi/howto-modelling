[project]
name = "howtomodeling"
version = "0.1.0"
description = "Execution-grounded NL->shell distillation pipeline (PoC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.109.1",
    "anthropic>=0.71.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "tenacity>=9.1.2",
    "rich>=14.0.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
    "peft>=0.17.0",
    "trl>=0.24.0",
    "datasets>=4.0.0",
    "accelerate>=1.10.0",
    "scikit-learn>=1.7.0",
    "numpy>=2.1.0",
    "bashlex>=0.18",
    "pillow>=12.3.0",
    "google-genai>=2.17.0",
]

[project.optional-dependencies]
# Only needed for GGUF export experiments; not part of the PoC critical path.
export = ["gguf>=0.17.0"]

[tool.uv]
# RTX 5090 (Blackwell, sm_120) requires a CUDA 12.8+ build of torch.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/howto"]
